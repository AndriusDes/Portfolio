<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portfolio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080808; overflow:hidden; font-family:'Courier New',monospace; color:#fff; user-select:none; cursor:crosshair; }
#canvas { display:block; position:fixed; top:0; left:0; cursor:crosshair; }
#name { position:fixed; top:28px; left:32px; font-size:10px; letter-spacing:0.35em; text-transform:uppercase; color:rgba(255,255,255,0.15); pointer-events:none; z-index:10; }

/* Zoom buttons – left side */
#zoom-btns {
  position:fixed; top:56px; left:32px;
  display:flex; flex-direction:column; gap:10px;
  z-index:20;
  transition: opacity 0.3s;
}

/* Nav buttons – always top right, never move */
#nav-btns {
  position:fixed; top:28px; right:32px;
  display:flex; flex-direction:row; gap:10px;
  z-index:110;
}

.zoom-btn {
  width:36px; height:36px; border-radius:50%;
  background:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
  flex-shrink:0;
  touch-action: manipulation;
}
.zoom-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
}
.zoom-btn:active { transform: scale(0.94); }
.zoom-btn svg { width:14px; height:14px; }

/* Mobile: nav buttons stay top right too */
@media (max-width: 768px) {
  #nav-btns { top:28px; right:28px; bottom:auto; }
}

#hint { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.13); pointer-events:none; transition:opacity 1.4s; z-index:10; }
#hint.hidden { opacity:0; }
#tooltip { position:fixed; pointer-events:none; transform:translate(-50%,-145%); background:rgba(8,8,8,0.92); border:1px solid rgba(255,255,255,0.1); padding:7px 13px; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.72); white-space:nowrap; opacity:0; transition:opacity 0.1s; z-index:50; }
#tooltip .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:7px; vertical-align:middle; }
#panel { position:fixed; top:0; right:0; width:340px; height:100vh; background:rgba(8,8,8,0.98); border-left:1px solid rgba(255,255,255,0.09); padding:80px 34px 48px; transform:translateX(100%); transition:transform 0.48s cubic-bezier(0.16,1,0.3,1); overflow-y:auto; z-index:100; touch-action: manipulation; }

#zoom-btns { touch-action: manipulation; }
#nav-btns  { touch-action: manipulation; }
#panel.open { transform:translateX(0); }

/* Mobile: bottom sheet 60% height */
@media (max-width: 768px) {
  #panel {
    top:auto; right:0; bottom:0; left:0;
    width:100%; height:60vh;
    border-left:none; border-top:1px solid rgba(255,255,255,0.09);
    border-radius:16px 16px 0 0;
    padding:24px 28px 36px;
    transform:translateY(100%);
  }
  #panel.open { transform:translateY(0); }
  #panel::before {
    content:'';
    display:block;
    width:36px; height:4px;
    background:rgba(255,255,255,0.18);
    border-radius:2px;
    margin:0 auto 20px;
  }
}
#panel-cat { font-size:10px; letter-spacing:0.32em; text-transform:uppercase; color:rgba(255,255,255,0.45); display:flex; align-items:center; gap:9px; margin-bottom:20px; }
#panel-cat .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
#panel-title { font-size:26px; font-weight:400; letter-spacing:0.02em; line-height:1.25; color:rgba(255,255,255,0.96); margin-bottom:10px; }
#panel-year { font-size:11px; color:rgba(255,255,255,0.38); letter-spacing:0.22em; margin-bottom:32px; }
#panel-line { height:1px; background:rgba(255,255,255,0.1); margin-bottom:32px; }
#panel-body { font-size:14px; line-height:1.85; color:rgba(255,255,255,0.72); letter-spacing:0.01em; }
#panel-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:32px; }
#panel-tags span { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; border:1px solid rgba(255,255,255,0.18); padding:6px 12px; color:rgba(255,255,255,0.48); }
#panel-media { margin-top:28px; display:flex; flex-direction:column; gap:14px; }
#panel-media img { width:100%; border-radius:6px; display:block; }
#panel-media iframe { border-radius:10px; display:block; }
</style>
</head>

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H, zoom=1, panX=0, panY=0;
let dots=[], hovered=null, panelOpen=false;
let hoverScales = [];    // per-dot smooth hover scale 1→1.5
let tooltipAlphas = [];  // per-dot smooth tooltip fade 0→1
let waveOriginX=0, waveOriginY=0, waveTime=-999; // for bounce wave

// Grid params – matched to AK-dots.png grid
const STEP   = 9;
const GAP    = 1.2;
const MAX_R  = STEP/2 - GAP;
const MIN_R  = 0.3;

const RIPPLE_RADIUS  = 90;   // world units
const PUSH_FORCE     = 22;   // white dots push strength
const PULL_FORCE     = 28;   // active dots pull strength
const PULL_RADIUS    = 110;  // active dots attracted from further
const DAMPING        = 0.78;
const SPRING         = 0.16;

// smoothstep: soft 0→1 with no hard edge
function smoothstep(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updateZoomButtons();
}
window.addEventListener('resize', resize);

const img = new Image();
img.onload = () => { buildGrid(); resize(); };
img.src = document.getElementById('source-img').src;

function buildGrid() {
  // Portrait world size
  const portW = 1100, portH = 1100;
  const ox = -portW/2, oy = -portH/2;

  const cols = Math.floor(portW / STEP);
  const rows = Math.floor(portH / STEP);

  // Sample the source image at grid resolution
  const oc = document.createElement('canvas');
  oc.width = cols; oc.height = rows;
  const oc2 = oc.getContext('2d');
  // Boost contrast to get crisp black/white
  oc2.filter = 'contrast(200%) brightness(100%)';
  oc2.drawImage(img, 0, 0, cols, rows);
  const px = oc2.getImageData(0, 0, cols, rows).data;

  // Find nearest grid cell for each active point – each gets unique cell
  // Sort by distance from face center first so central dots get priority
  const activeMap = new Map();
  const usedKeys = new Set();

  const faceCX = 0.50, faceCY = 0.50; // face center in normalized coords
  const sortedActive = ACTIVE_DEF
    .map((ad, ai) => ({ ad, ai, dist: Math.hypot(ad.nx - faceCX, ad.ny - faceCY) }))
    .sort((a, b) => a.dist - b.dist);

  sortedActive.forEach(({ ad, ai }) => {
    const gc = Math.round(ad.nx * (cols-1));
    const gr = Math.round(ad.ny * (rows-1));

    let bestKey = null, bestDist = Infinity;
    for (let radius = 0; radius <= 5; radius++) { // max 5 cells away
      for (let dr = -radius; dr <= radius; dr++) {
        for (let dc = -radius; dc <= radius; dc++) {
          if (Math.abs(dr) !== radius && Math.abs(dc) !== radius) continue;
          const r2 = Math.max(0, Math.min(rows-1, gr+dr));
          const c2 = Math.max(0, Math.min(cols-1, gc+dc));
          const key = `${c2},${r2}`;
          if (usedKeys.has(key)) continue;
          const idx = (r2*cols+c2)*4;
          const br = (px[idx]*0.299+px[idx+1]*0.587+px[idx+2]*0.114)/255;
          if (br > 0.15) {
            const d = Math.hypot(dc, dr);
            if (d < bestDist) { bestDist = d; bestKey = key; }
          }
        }
      }
      if (bestKey !== null) break;
    }
    if (bestKey) { activeMap.set(bestKey, ai); usedKeys.add(bestKey); }
  });

  dots = [];
  for (let row=0; row<rows; row++) {
    for (let col=0; col<cols; col++) {
      const i = (row*cols+col)*4;
      // PNG: white dots on black bg
      // white = face dot (high brightness) → draw dot
      // black = background → skip
      const brightness = (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114)/255;

      if (brightness < 0.15) continue; // skip background

      const wx = ox + (col+0.5)*STEP;
      const wy = oy + (row+0.5)*STEP;

      // White area = large dot in source → BUT source has varying dot sizes
      // High brightness = big white dot → map to large circle
      const r = MIN_R + Math.pow(brightness, 0.8) * (MAX_R - MIN_R);

      const key = `${col},${row}`;
      dots.push({
        wx, wy,          // current world pos
        ox: wx, oy: wy,  // origin (rest position)
        vx: 0, vy: 0,    // velocity
        r,
        activeIdx: activeMap.has(key) ? activeMap.get(key) : null
      });
    }
  }

  panX = W/2; panY = H/2;
  zoom = getMinZoom() * 2;
  setTimeout(updateZoomButtons, 0); // after DOM ready

  console.log('Dots built:', dots.length);
  if (rafId) cancelAnimationFrame(rafId);
  physicsStep();
}

const w2s = (wx,wy) => [panX+wx*zoom, panY+wy*zoom];
const s2w = (sx,sy) => [(sx-panX)/zoom, (sy-panY)/zoom];

const HOVER_RADIUS = RIPPLE_RADIUS / 2; // hover/click zone – half of ripple
let mouseWX = -9999, mouseWY = -9999;
let isAutoMode = false; // true when mouse is over UI (panel/nav/zoom)

// Track when mouse enters/leaves UI elements
['panel','nav-btns','zoom-btns'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('mouseenter', () => { isAutoMode = true; });
  el.addEventListener('mouseleave', () => { isAutoMode = false; });
});

// ─── PHYSICS LOOP ─────────────────────────────────────────────────────────────
let rafId = null;

function physicsStep() {
  const now = performance.now() / 1000;

  // Ripple origin = visual center (accounts for drawer offset on desktop)
  const visualCX = getVisualCenterX();
  const visualCY = getVisualCenterY();
  const isMobile = window.innerWidth <= 768;
  const useCenter = isMobile || isAutoMode;
  const rippleWX = useCenter ? (visualCX - panX) / zoom : mouseWX;
  const rippleWY = useCenter ? (visualCY - panY) / zoom : mouseWY;

  // Find single nearest active dot to ripple origin
  let nearestActive = null, nearestDist = Infinity;
  dots.forEach((d, i) => {
    if (d.activeIdx === null) return;
    const dist = Math.hypot(d.ox - rippleWX, d.oy - rippleWY);
    if (dist < PULL_RADIUS && dist < nearestDist) {
      nearestDist = dist;
      nearestActive = i;
    }
  });

  dots.forEach((d, i) => {
    if (d.activeIdx !== null && i === nearestActive) {
      const ORBIT_R     = MAX_R * 0.9;
      const ORBIT_SPEED = 1.8;
      const angle = now * ORBIT_SPEED;
      const targetX = d.ox + Math.cos(angle) * ORBIT_R;
      const targetY = d.oy + Math.sin(angle) * ORBIT_R;
      d.wx += (targetX - d.wx) * 0.12;
      d.wy += (targetY - d.wy) * 0.12;
      d.vx = 0; d.vy = 0;
      return;
    }

    d.vx += (d.ox - d.wx) * SPRING;
    d.vy += (d.oy - d.wy) * SPRING;

    // Push away from ripple origin
    const mdx  = d.wx - rippleWX;
    const mdy  = d.wy - rippleWY;
    const dist = Math.hypot(mdx, mdy);
    if (dist < RIPPLE_RADIUS && dist > 0.1) {
      const t     = 1 - dist / RIPPLE_RADIUS;
      const force = smoothstep(t) * PUSH_FORCE;
      d.vx += (mdx / dist) * force;
      d.vy += (mdy / dist) * force;
    }

    // Wave from zoom (short burst)
    const now2 = performance.now()/1000;
    const waveDt = now2 - waveTime;
    if (waveDt < 1.2) {
      const wdx   = d.wx - waveOriginX;
      const wdy   = d.wy - waveOriginY;
      const wdist = Math.hypot(wdx, wdy);
      // Expanding ring: peak at wdist == waveFront
      const waveFront = waveDt * 320;
      const diff = Math.abs(wdist - waveFront);
      if (diff < 55) {
        const t     = 1 - diff / 55;
        const force = smoothstep(t) * 8 * Math.exp(-waveDt * 2);
        if (wdist > 0.1) {
          d.vx += (wdx / wdist) * force;
          d.vy += (wdy / wdist) * force;
        }
      }
    }

    d.vx *= DAMPING;
    d.vy *= DAMPING;
    d.wx += d.vx;
    d.wy += d.vy;
  });

  // ─── HOVERED recalc every frame ─────────────────────────────────────────────
  // Runs in physicsStep so cursor always reflects moving dots
  if (!isAutoMode && window.innerWidth > 768) {
    let found = null, foundDist = Infinity;
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i]; if (d.activeIdx === null) continue;
      const dist = Math.hypot(mouseWX - d.wx, mouseWY - d.wy);
      if (dist < HOVER_RADIUS && dist < foundDist) { found = i; foundDist = dist; }
    }
    if (found !== hovered) { hovered = found; updateCursor(); }
  } else if (isAutoMode || window.innerWidth <= 768) {
    if (hovered !== null) { hovered = null; updateCursor(); }
  }

  draw();
  updateMobileFocus();
  rafId = requestAnimationFrame(physicsStep);
}

function draw() {
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);

  const isMobileView = window.innerWidth <= 768;
  const now = performance.now() / 1000;

  dots.forEach((d,i) => {
    const [sx,sy] = w2s(d.wx, d.wy);
    const isActive = d.activeIdx !== null;
    const isHov    = hovered === i;

    // Mobile focus strength for this dot (0→1)
    const focusStr = isMobileView ? (mobileFocusStrengths[i] || 0) : 0;
    const pulseScale = isMobileView ? getMobilePulseScale(i, now) : 1;

    // Bubble grows with focus strength + pulse
    const focusGrow = 1 + focusStr * 0.9;
    const baseR = isActive ? d.r * 1.4 * focusGrow * pulseScale : d.r;
    const sr = baseR * zoom;

    if (sr < 0.2) return;
    if (sx+sr<-10||sx-sr>W+10||sy+sr<-10||sy-sr>H+10) return;

    if (isActive) {
      const ad  = ACTIVE_DEF[d.activeIdx];
      const col = ad.color;

      // Smooth hover scale lerp: 1.0 → 1.45
      const targetScale = isHov ? 1.45 : 1.0;
      hoverScales[i] = hoverScales[i] === undefined ? 1.0 : hoverScales[i];
      hoverScales[i] += (targetScale - hoverScales[i]) * 0.12;
      const hScale = hoverScales[i];
      const dr = sr * hScale;

      // Smooth tooltip alpha lerp
      const targetTipAlpha = isMobileView ? focusStr : (isHov ? 1 : 0);
      tooltipAlphas[i] = tooltipAlphas[i] === undefined ? 0 : tooltipAlphas[i];
      tooltipAlphas[i] += (targetTipAlpha - tooltipAlphas[i]) * 0.10;
      const tipAlpha = tooltipAlphas[i];

      // Glow
      const glowStrength = isMobileView ? focusStr : (hoverScales[i] - 1) / 0.45;
      if (glowStrength > 0.01) {
        const g = ctx.createRadialGradient(sx,sy,0,sx,sy,dr*3.8);
        g.addColorStop(0,`rgba(74,170,110,${0.32 * glowStrength})`);
        g.addColorStop(1,'rgba(74,170,110,0)');
        ctx.beginPath(); ctx.arc(sx,sy,dr*3.8,0,Math.PI*2);
        ctx.fillStyle=g; ctx.fill();
      }

      // Circle
      ctx.beginPath(); ctx.arc(sx,sy,dr,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy,dr*0.42,0,Math.PI*2);
      ctx.fillStyle='#080808'; ctx.fill();

      // Tooltip – anchored to origin screen pos, zoom-independent crisp text
      if (tipAlpha > 0.01) {
        const [osx, osy] = w2s(d.ox, d.oy);
        const anchorR = d.r * 1.4 * zoom;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        const fontSize = 12;
        // Reset to identity * dpr for crisp pixel rendering
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const label = ad.tooltip.split(' · ')[0].toUpperCase();
        ctx.font = `${fontSize}px 'Courier New', monospace`;
        ctx.textAlign = 'left';

        const textW = ctx.measureText(label).width;
        const ph = 28;
        const pw = textW + 24;
        const px2 = osx - pw/2;
        const py  = osy - anchorR - ph - 8;
        const rx  = ph / 2;

        ctx.globalAlpha = tipAlpha;
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(px2+rx, py);
        ctx.lineTo(px2+pw-rx, py);
        ctx.arcTo(px2+pw, py, px2+pw, py+ph, rx);
        ctx.lineTo(px2+pw, py+ph-rx);
        ctx.arcTo(px2+pw, py+ph, px2+pw-rx, py+ph, rx);
        ctx.lineTo(px2+rx, py+ph);
        ctx.arcTo(px2, py+ph, px2, py+ph-rx, rx);
        ctx.lineTo(px2, py+rx);
        ctx.arcTo(px2, py, px2+rx, py, rx);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillText(label, px2 + 14, py + ph/2 + fontSize * 0.36);

        ctx.restore();
      }

    } else {
      ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fill();
    }
  });
}

// ─── ZOOM ─────────────────────────────────────────────────────────────────────
// Portrait world size = 1100 units. Min zoom = fits in screen height
function getMinZoom() {
  const isMobile = window.innerWidth <= 768;
  if (isMobile) {
    // Mobile: portrait height fills screen height
    return H / 1100;
  }
  return Math.min(W, H) / 1100 * 0.92;
}

function updateZoomButtons() {
  if (!dots.length) return; // not built yet
  const minZ = getMinZoom();
  const btnIn  = document.getElementById('btn-zoom-in');
  const btnOut = document.getElementById('btn-zoom-out');
  if (!btnIn || !btnOut) return;
  btnOut.style.opacity = zoom <= minZ * 1.01 ? '0.5' : '1';
  btnOut.style.pointerEvents = zoom <= minZ * 1.01 ? 'none' : 'auto';
  btnIn.style.opacity  = zoom >= 7.99 ? '0.5' : '1';
  btnIn.style.pointerEvents = zoom >= 7.99 ? 'none' : 'auto';
}

function applyZoom(delta, cx, cy) {
  const minZ = getMinZoom();
  const f  = delta > 0 ? 0.87 : 1.15;
  const nz = Math.min(8, Math.max(minZ, zoom * f));
  panX = cx - (cx - panX) * (nz / zoom);
  panY = cy - (cy - panY) * (nz / zoom);
  zoom = nz;
  const [wx,wy] = s2w(cx, cy);
  waveOriginX=wx; waveOriginY=wy;
  waveTime=performance.now()/1000;
  updateZoomButtons();
}
canvas.addEventListener('wheel',e=>{e.preventDefault();applyZoom(e.deltaY,e.clientX,e.clientY);},{passive:false});

// Zoom buttons
document.getElementById('btn-zoom-in').addEventListener('click', ()=>{ applyZoom(-1,W/2,H/2); });
document.getElementById('btn-zoom-out').addEventListener('click', ()=>{ applyZoom(1,W/2,H/2); });

// ─── MOBILE CENTER PROXIMITY REVEAL ──────────────────────────────────────────
const MOBILE_REVEAL_R = 130; // screen pixels from center
let mobileFocusStrengths = []; // per-dot 0→1 strength
let mobilePulseTime = {};      // dotIdx → time when it reached full focus

function updateMobileFocus() {
  if (window.innerWidth > 768) return;
  const cx = getVisualCenterX(), cy = getVisualCenterY();
  const now = performance.now() / 1000;

  dots.forEach((d, i) => {
    if (d.activeIdx === null) return;
    const [sx, sy] = w2s(d.wx, d.wy);
    const dist = Math.hypot(sx - cx, sy - cy);
    // Strength: 1 at center, 0 at MOBILE_REVEAL_R
    const raw = Math.max(0, 1 - dist / MOBILE_REVEAL_R);
    const strength = smoothstep(raw);

    const prev = mobileFocusStrengths[i] || 0;
    // Smooth lerp toward target
    mobileFocusStrengths[i] = prev + (strength - prev) * 0.12;

    // Trigger pulse when dot first reaches near-full focus
    if (strength > 0.85 && prev < 0.85) {
      mobilePulseTime[i] = now;
    }
  });
}

function getMobilePulseScale(i, now) {
  const pt = mobilePulseTime[i];
  if (pt === undefined) return 1;
  const dt = now - pt;
  if (dt > 0.8) return 1;
  // Elastic pulse: quick grow then settle
  const t = dt / 0.8;
  return 1 + 0.22 * Math.sin(t * Math.PI) * Math.exp(-t * 3);
}

// ─── PAN + HOVER ──────────────────────────────────────────────────────────────
// ─── CURSOR ───────────────────────────────────────────────────────────────────
// Single source of truth for cursor state
// Priority: grabbing > pointer > crosshair
function updateCursor() {
  if (isPanning)          canvas.style.cursor = 'grabbing';
  else if (hovered !== null) canvas.style.cursor = 'pointer';
  else                    canvas.style.cursor = 'crosshair';
}

let isPanning=false, panStart=null, didDrag=false;

canvas.addEventListener('mousedown', e => {
  isPanning = true; didDrag = false;
  panStart = { x:e.clientX, y:e.clientY, px:panX, py:panY };
  updateCursor();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  updateCursor();
});

window.addEventListener('mousemove', e => {
  const [wx,wy] = s2w(e.clientX, e.clientY);
  mouseWX = wx; mouseWY = wy;

  if (isPanning && panStart) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
    panX = panStart.px + dx; panY = panStart.py + dy;
  }
  document.getElementById('tooltip').style.opacity = '0';
});

canvas.addEventListener('click',e=>{
  if(didDrag)return;
  const [wx,wy]=s2w(e.clientX,e.clientY);
  let found=null, foundDist=Infinity;
  for(let i=0;i<dots.length;i++){
    const d=dots[i]; if(d.activeIdx===null) continue;
    const dist=Math.hypot(wx-d.wx,wy-d.wy);
    if(dist<HOVER_RADIUS && dist<foundDist){ found=i; foundDist=dist; }
  }
  if(found!==null) openPanel(ACTIVE_DEF[dots[found].activeIdx]);
  else if(panelOpen) closePanel();
});

// ─── TOUCH ────────────────────────────────────────────────────────────────────
let t1=null,lastPinch=null;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){t1={x:e.touches[0].clientX,y:e.touches[0].clientY,px:panX,py:panY};lastPinch=null;}
  else if(e.touches.length===2){t1=null;lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&t1){panX=t1.px+e.touches[0].clientX-t1.x;panY=t1.py+e.touches[0].clientY-t1.y;draw();}
  else if(e.touches.length===2&&lastPinch!==null){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    applyZoom(lastPinch>d?1:-1,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);
    lastPinch=d;
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(t1&&e.changedTouches.length===1){
    const dx=Math.abs(e.changedTouches[0].clientX-t1.x),dy=Math.abs(e.changedTouches[0].clientY-t1.y);
    if(dx<12&&dy<12){
      // Same hit logic for both mobile and desktop – HOVER_RADIUS in world units
      const [wx,wy]=s2w(t1.x,t1.y);
      let found=null, foundDist=Infinity;
      for(let i=0;i<dots.length;i++){
        const d=dots[i]; if(d.activeIdx===null) continue;
        const dist=Math.hypot(wx-d.wx,wy-d.wy);
        if(dist<HOVER_RADIUS && dist<foundDist){ found=i; foundDist=dist; }
      }
      if(found!==null) openPanel(ACTIVE_DEF[dots[found].activeIdx]);
      else if(panelOpen) closePanel();
    }
  }
  t1=null;lastPinch=null;
},{passive:true});

// ─── PANEL ────────────────────────────────────────────────────────────────────
const panel    = document.getElementById('panel');
const navBtns  = document.getElementById('nav-btns');
let swX=null, swipeY=null;
let currentNavIdx = 0;

function getDotByActiveIdx(ai) {
  return dots.findIndex(d => d.activeIdx === ai);
}

// Smooth camera fly to world position
// On desktop with open drawer, visual center shifts left by half drawer width
let isFlyingTo = false;
function getVisualCenterX() {
  const isMobile = window.innerWidth <= 768;
  if (!isMobile && panelOpen) return W/2 - 170;
  return W/2;
}

function getVisualCenterY() {
  const isMobile = window.innerWidth <= 768;
  if (isMobile && panelOpen) return H/2 - H * 0.30; // shift up 30vh (60vh drawer / 2)
  return H/2;
}

function flyTo(wx, wy, onDone) {
  isFlyingTo = true;
  const startPX=panX, startPY=panY;
  const targetPX = getVisualCenterX() - wx*zoom;
  const targetPY = getVisualCenterY() - wy*zoom;
  const startT=performance.now();
  const DUR=520;
  function step(){
    const t=Math.min(1,(performance.now()-startT)/DUR);
    const e2=t<0.5?2*t*t:-1+(4-2*t)*t;
    panX=startPX+(targetPX-startPX)*e2;
    panY=startPY+(targetPY-startPY)*e2;
    if(t<1) requestAnimationFrame(step);
    else {
      panX=targetPX; panY=targetPY;
      isFlyingTo=false;
      if(onDone) onDone();
    }
  }
  requestAnimationFrame(step);
}

function renderPanel(d) {
  document.getElementById('pc-dot').style.background=d.color;
  document.getElementById('pc-label').textContent=d.category;
  document.getElementById('panel-title').textContent=d.title;
  document.getElementById('panel-year').textContent=d.year;
  document.getElementById('panel-body').textContent=d.body;
  document.getElementById('panel-tags').innerHTML=d.tags.map(t=>`<span>${t}</span>`).join('');
  const media=document.getElementById('panel-media');
  let mh='';
  if(d.img)        mh+=`<img src="${d.img}" alt="${d.title}">`;
  if(d.spotify)    mh+=`<iframe src="${d.spotify}" width="100%" height="152" frameBorder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  if(d.soundcloud) mh+=`<iframe width="100%" height="120" scrolling="no" frameborder="no" allow="autoplay" src="${d.soundcloud}"></iframe>`;
  media.innerHTML=mh;
}

function openPanel(d, skipFly) {
  const ai=ACTIVE_DEF.indexOf(d);
  if(ai!==-1) currentNavIdx=ai;
  renderPanel(d);

  const wasOpen = panelOpen;
  panel.style.transform='';
  panel.classList.add('open');
  panelOpen=true; // set BEFORE flyTo so getVisualCenterY/X use shifted values

  if (!wasOpen && !skipFly) {
    const di = getDotByActiveIdx(currentNavIdx);
    if (di !== -1) flyTo(dots[di].ox, dots[di].oy);
  }
}

function closePanel(){
  panel.classList.remove('open');
  panel.style.transform='';
  panelOpen=false;
}

function navigateTo(idx){
  const n=ACTIVE_DEF.length;
  currentNavIdx=((idx%n)+n)%n;
  const d=ACTIVE_DEF[currentNavIdx];
  const di=getDotByActiveIdx(currentNavIdx);

  renderPanel(d);

  // Ensure panel is open BEFORE flyTo so getVisualCenterX/Y use shifted values
  panel.style.transform='';
  panel.classList.add('open');
  panelOpen=true;

  if(di!==-1){
    flyTo(dots[di].ox, dots[di].oy);
  }
}

document.getElementById('btn-prev').addEventListener('click',()=>navigateTo(currentNavIdx-1));
document.getElementById('btn-next').addEventListener('click',()=>navigateTo(currentNavIdx+1));

// Swipe to close panel
panel.addEventListener('touchstart',e=>{
  swX=e.touches[0].clientX; swipeY=e.touches[0].clientY;
},{passive:true});
panel.addEventListener('touchmove',e=>{
  const isMobile=window.innerWidth<=768;
  if(isMobile){
    if(swipeY===null)return;
    const dy=e.touches[0].clientY-swipeY;
    if(dy>0) panel.style.transform=`translateY(${dy}px)`;
  } else {
    if(swX===null)return;
    const dx=e.touches[0].clientX-swX;
    if(dx>0) panel.style.transform=`translateX(${dx}px)`;
  }
},{passive:true});
panel.addEventListener('touchend',e=>{
  const isMobile=window.innerWidth<=768;
  if(isMobile){
    if(swipeY===null)return;
    if(e.changedTouches[0].clientY-swipeY>90) closePanel();
    else panel.style.transform='';
    swipeY=null; swX=null;
  } else {
    if(swX===null)return;
    if(e.changedTouches[0].clientX-swX>80) closePanel();
    else panel.style.transform='';
    swX=null; swipeY=null;
  }
},{passive:true});

setTimeout(()=>document.getElementById('hint').classList.add('hidden'),4500);
resize();
</script>
